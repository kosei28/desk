[package]
name = "desk-core"
version = "0.1.0"
description = "desk のツリーの形の解釈（CLI とアプリで共有する）"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# 書く側（init・new・archive・mv・check --fix の計画と当て方）。CLI だけが有効にし、アプリは有効にしない。
write = []

[dependencies]
# 日付を読むだけなので、タイムゾーンの機能は CLI に任せる
jiff = { version = "0.2.43", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
relative-path = "2.0.3"
saphyr-parser = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
