[workspace]
# default-members は core と cli にし、直下の cargo build・cargo test では Node も Tauri も要らないようにする。
members = ["core", "cli", "app/src-tauri"]
default-members = ["core", "cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kosei28/desk"

[workspace.lints.rust]
unsafe_code = "forbid"
