[package]
name = "desk-cli"
version = "0.1.0"
description = "desk の CLI（作業ドキュメントのツリーの形を扱う補助ツール）"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "desk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "unicode"] }
desk-core = { path = "../core", features = ["write"] }
jiff = "0.2.43"
serde = "1.0.229"
serde_json = "1.0.154"
unicode-width = "0.2.3"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"

[lints]
workspace = true
